<h2 style="margin: 0; font-family: var(--font-serif); font-weight: 500; font-size: 36px; line-height: 42px">When is your report due?</h2>
<p style="margin: 0; color: var(--ink-600)">The first deadline depends on where your strata is. It applies if your strata has no depreciation report, or its last report is dated before December 31, 2020. After that, a new report is needed at least every five years.</p>
<p style="margin: 0; font-size: 14px; line-height: 22px; color: var(--ink-600)">New stratas formed from July 1, 2024 to June 30, 2027 need a first report within two years of the first AGM; from July 1, 2027, within 18 months. General information, not legal advice.</p>
</div>

<div class="dlg-b" style="padding: 56px 88px 72px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; max-width: 820px; font-size: 20px; line-height: 32px; color: var(--ink-900)">From West End concrete towers to Kitsilano walk-ups and East Vancouver townhouses, Vancouver has some of the oldest strata buildings in BC. We prepare clear, compliant reports that show council what is coming and how to fund it.</p>
<p style="margin: 0; padding: 14px 18px; border-left: 3px solid var(--brass-600); background: var(--paper-050); font-size: 15px; line-height: 23px">Vancouver is in the Metro Vancouver Regional District. First deadline: <b>July 1, 2026</b> for stratas with no report or a last report dated before December 31, 2020; then every five years.</p>
<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">Old, varied and often renovated</h3>
<p style="margin: 0; color: var(--ink-600); max-width: 760px">Many Vancouver stratas have been through envelope repairs, re-piping or elevator upgrades already. Your records of that work matter as much as the inspection.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px"><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/7ce678e96ebe20a8d23ffa6cc40313b1.jpg" alt="High-rise residential towers with mountains behind" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Concrete towers</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">West End, Downtown, Yaletown, Coal Harbour</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Towers from the 1960s and 70s next to newer glass buildings. Elevators, windows, balconies and mechanical plant drive the forecast.</p></div><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/5ff131497777dcb674c0a65f8da2c913.jpg" alt="Four-storey wood-frame apartment buildings among trees" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Walk-ups and low-rises</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">Kitsilano, Fairview, Mount Pleasant, Marpole, Kerrisdale</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Wood-frame apartments, many from the 1970s to 1990s. Envelope history, roofing, plumbing and parkade membranes are the big items.</p></div><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/2197f17bbb98c267932f4669ac644cfb.jpg" alt="Three-storey townhouses with garages" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Townhouses and small stratas</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">East Vancouver, Dunbar, Killarney, Champlain Heights</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Townhouse complexes and small stratas of five lots or more. Roofs, siding, decks and site work matter most.</p></div></div>
<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">What we look at closely in Vancouver</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 40px"><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Envelope repair history</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Buildings from the 1980s and 90s often had rainscreen repairs. We record what was done and when, so the forecast starts from the real condition, not the original build date.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Aging plumbing and electrical</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Older buildings may be due for re-piping, riser replacement or electrical upgrades. We flag these as components with their own cost and timing.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Elevators and mechanical plant</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Modernizing an older elevator is one of the largest single costs a tower faces. We plan it years ahead so it does not arrive as a surprise levy.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Heritage and character buildings</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Some older and character buildings have materials and details that cost more to repair or replace. We price them on that basis.</p></div></div>
<h3 style="margin: 16px 0 0; font-size: 18px; line-height: 26px; font-weight: 600">Neighbourhoods we serve</h3>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px"><li class="chip">West End</li><li class="chip">Downtown</li><li class="chip">Yaletown</li><li class="chip">Coal Harbour</li><li class="chip">Kitsilano</li><li class="chip">Fairview</li><li class="chip">Mount Pleasant</li><li class="chip">Marpole</li><li class="chip">Kerrisdale</li><li class="chip">Dunbar</li><li class="chip">Hastings-Sunrise</li><li class="chip">Renfrew-Collingwood</li><li class="chip">Killarney</li><li class="chip">Champlain Heights</li></ul>

<div style="position: absolute; left: 56px; top: 44px; right: 120px; color: #FFFFFF"><p style="margin: 0; font-family: var(--font-serif); font-weight: 500; font-size: 56px; line-height: 62px">Burnaby</p><p style="margin: 6px 0 0; font-size: 20px; line-height: 28px; color: var(--mist-100)">Towers at Metrotown and Brentwood, older townhouses across South Burnaby.</p></div>
</div>
<div class="dlg-b" style="padding: 56px 88px 72px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; max-width: 820px; font-size: 20px; line-height: 32px; color: var(--ink-900)">Burnaby combines new towers at Metrotown and Brentwood with townhouse complexes and garden apartments built decades ago. We prepare reports that fit both, written so every council member can follow the numbers.</p>
<p style="margin: 0; padding: 14px 18px; border-left: 3px solid var(--brass-600); background: var(--paper-050); font-size: 15px; line-height: 23px">Burnaby is in the Metro Vancouver Regional District. First deadline: <b>July 1, 2026</b> for stratas with no report or a last report dated before December 31, 2020; then every five years.</p>
<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">Towers by SkyTrain, townhouses everywhere else</h3>
<p style="margin: 0; color: var(--ink-600); max-width: 760px">A Burnaby tower and a 1980s townhouse complex need very different forecasts. We build each one from what we see on site and the records you provide.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px"><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/7ce678e96ebe20a8d23ffa6cc40313b1.jpg" alt="High-rise residential towers with mountains behind" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">High-rise towers</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">Metrotown, Brentwood, Lougheed, Edmonds</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Concrete towers near SkyTrain, many under 20 years old. Window walls, elevators, mechanical systems and parkade membranes lead the forecast.</p></div><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/2197f17bbb98c267932f4669ac644cfb.jpg" alt="Three-storey townhouses with garages" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Townhouse complexes</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">South Burnaby, Edmonds, Cariboo, Government Road</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Complexes from the 1970s to 2000s. Roofs, siding, windows, decks and paving come due in cycles.</p></div><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/5ff131497777dcb674c0a65f8da2c913.jpg" alt="Four-storey wood-frame apartment buildings among trees" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Low-rise apartments</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">Burnaby Heights, Capitol Hill, Brentwood Park</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Wood-frame and concrete low-rises. Envelope, roofing and plumbing are the main items.</p></div></div>
<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">What we look at closely in Burnaby</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 40px"><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Window walls and glazing</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Many newer towers use window wall systems. Seals and glazing units have shorter lives than the concrete around them, and we plan for that.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Elevators and mechanical systems</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Towers carry several elevators, pumps, boilers or heat pumps and make-up air units. Each gets its own cost and remaining life.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Parkade membranes</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Underground parkades under podiums and driveways need membrane and drainage work. We include it before leaks start.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Burnaby Mountain conditions</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Buildings at UniverCity sit at higher elevation, with more snow and rain than the rest of the city. We allow for it in roofs and exterior work.</p></div></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px"><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/7ce678e96ebe20a8d23ffa6cc40313b1.jpg" alt="High-rise residential towers with mountains behind" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Lonsdale towers and mid-rises</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">Lower Lonsdale, Central Lonsdale, Lynn Creek</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Concrete towers and mid-rises. Windows, balconies, elevators and mechanical systems lead the forecast.</p></div><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/2197f17bbb98c267932f4669ac644cfb.jpg" alt="Three-storey townhouses with garages" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Townhouses</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">Lynn Valley, Deep Cove, Seymour, Edgemont, Lions Gate</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Complexes on sloping, treed sites. Roofs, siding, decks, retaining walls and drainage are the big items.</p></div><div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--mist-100)"><img src="assets/img/5ff131497777dcb674c0a65f8da2c913.jpg" alt="Four-storey wood-frame apartment buildings among trees" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Low-rise apartments</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">Central Lonsdale, Lower Lonsdale, Marine Drive</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Wood-frame low-rises. Envelope, roofing and parkade membranes need careful planning.</p></div></div>
<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">What we look at closely in North Vancouver</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 40px"><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Rain and the building envelope</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Heavy rainfall puts envelopes, windows and membranes under more stress. We look for signs of water getting in and plan repairs early.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Roofs under trees</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Moss, needles and debris shorten roof and gutter life. Remaining lives reflect what we see on your roofs.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Slopes, retaining walls and drainage</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Steep sites depend on retaining walls, perimeter drains and storm systems. These get their own lines in the forecast.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Decks and balconies</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Wood decks and balcony membranes wear faster in wet conditions. We record their condition and plan replacement.</p></div></div>

<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">Older apartments, high-end finishes</h3>
<p style="margin: 0; color: var(--ink-600); max-width: 760px">Many West Vancouver apartment buildings are over 50 years old, and finishes are often above average. Both raise replacement costs, and both belong in the report.</p>

trees" style="width: 100%; height: 100%; object-fit: cover; display: block"></div><h4 style="margin: 6px 0 0; font-size: 20px; line-height: 28px; font-weight: 600">Newer luxury low-rises</h4><p style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; color: var(--brass-600)">Ambleside, Dundarave, Horseshoe Bay</p><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Newer buildings with premium finishes. Accurate replacement costs matter for both the forecast and insurance.</p></div></div>
<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">What we look at closely in West Vancouver</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 40px"><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Coastal exposure</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Salt air and wind-driven rain wear railings, metal flashings, windows and balcony membranes. We look for it at inspection.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Balconies and windows in older concrete</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Balcony slabs, railings and original windows are common major items in older apartments.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Higher-end finishes</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Lobbies, amenity spaces and exterior materials often cost more to replace. We price them as built, not as average.</p></div><div style="border-top: 1px solid var(--line-200); padding: 16px 0"><h4 style="margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600">Insurance appraisal alongside</h4><p style="margin: 0; font-size: 15px; line-height: 24px; color: var(--ink-600)">Replacement costs in a high-value building also matter for insurance. We can prepare an insurance appraisal with your report.</p></div></div>

<p style="margin: 0; padding: 14px 18px; border-left: 3px solid var(--brass-600); background: var(--paper-050); font-size: 15px; line-height: 23px">Coquitlam is in the Metro Vancouver Regional District. First deadline: <b>July 1, 2026</b> for stratas with no report or a last report dated before December 31, 2020; then every five years.</p>
<h3 style="margin: 24px 0 0; font-family: var(--font-serif); font-weight: 500; font-size: 32px; line-height: 38px">Transit towers and hillside townhouses</h3>
<p style="margin: 0; color: var(--ink-600); max-width: 760px">The Tri-Cities mix new high-rises with older low-rises and townhouse complexes on sloping sites. Each type ages differently.</p>
