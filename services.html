/* Motion */
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

 #top>div>div:first-child>*:nth-child(2){animation-delay:.15s}
 #top>div>div:first-child>*:nth-child(3){animation:grow .8s .35s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
 #top>div>div:first-child>*:nth-child(4){animation-delay:.4s}
 #top>div>div:first-child>*:nth-child(5){animation-delay:.5s}
 #top>div>div:first-child>*:nth-child(6){animation-delay:.6s}
 #top>div>div:first-child>*:nth-child(7){animation-delay:.7s}
 #top>div>div:last-child{animation:fadein 1.2s .2s ease both}

 .ph>div>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}

 .nl:hover::after{transform:scaleX(1)}

 .btn-o:hover{background:var(--evergreen-700)!important;color:#FFFFFF!important}

 figure [style*="aspect-ratio: 4 / 3"] img,#services [style*="aspect-ratio: 4 / 3"] img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
 figure:hover [style*="aspect-ratio: 4 / 3"] img,#services [style*="aspect-ratio: 4 / 3"]:hover img{transform:scale(1.06)}
 .card{transition:transform .3s,border-color .3s}
 .card:hover{transform:translateY(-4px)}
 #pricing [style*="padding: 24px 24px 24px 0"]{box-shadow:inset 0 -2px 0 transparent;transition:transform .3s,box-shadow .3s}
 #pricing [style*="padding: 24px 24px 24px 0"]:hover{transform:translateY(-4px);box-shadow:inset 0 -2px 0 var(--evergreen-700)}
 #services [style*="padding: 24px 0"]{transition:padding-left .3s,background-color .3s}
 #services [style*="padding: 24px 0"]:hover{padding-left:12px!important;background:var(--surface)}

 /* hover reveal text */
 [data-tip]{position:relative;cursor:default}
 [data-tip]::after{content:attr(data-tip);position:absolute;inset:0;display:flex;align-items:flex-end;padding:20px;box-sizing:border-box;background:linear-gradient(to top,rgba(14,38,28,.94) 0%,rgba(14,38,28,.82) 60%,rgba(14,38,28,.55) 100%);color:#FFFFFF;font-family:var(--font-sans);font-size:15px;line-height:22px;font-weight:500;opacity:0;transform:translateY(12px);transition:opacity .35s,transform .35s cubic-bezier(.2,.7,.2,1);pointer-events:none;z-index:2}
 [data-tip]:hover::after{opacity:1;transform:none}
 #pricing [data-tip]::after{padding:16px;font-size:14px;line-height:20px;align-items:center}

 /* reveal on scroll */
 @supports (animation-timeline: view()){
  main section:not(#top):not(.ph) h2,main section figure,.card,#services [style*="padding: 24px 0"],#pricing [style*="padding: 24px 24px 24px 0"],#planning li,#current [style*="padding: 20px 0"],#faq [style*="padding: 20px 0"],#quote form{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 22%}

 }
}

.fbar a.fb-go:hover{background:#163A2B!important}
